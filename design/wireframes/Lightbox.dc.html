<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin:0; background:#ffffff; color:#1a1a1a;
      font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif;
      -webkit-font-smoothing: antialiased; }
    a { color:#1a1a1a; text-decoration:none; } a:hover { color:#000000; }
    .ph { position:relative; background:#ededed; border:1px dashed #bfbfbf; overflow:hidden; }
    .ph svg { position:absolute; inset:0; width:100%; height:100%; }
    .bar { height:10px; background:#e6e6e6; border-radius:2px; }
    .cap { font:11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color:#8a8a8a; letter-spacing:0.02em; }
    .chip { display:inline-block; padding:3px 8px; border:1px solid #c9c9c9; font:11px/1.2 ui-monospace, Menlo, monospace; color:#6b6b6b; }
    .note { border-left:2px dashed #c9c9c9; padding-left:10px;
      font:11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color:#8a8a8a; }
    .btn { border:1px solid #1a1a1a; padding:8px 14px; font-size:12px; display:inline-flex; align-items:center; gap:6px; }
    .rule { height:1px; background:#dcdcdc; }
  </style>
</helmet>

<div style="width:960px; height:680px; background:#2b2b2b; box-sizing:border-box; padding:28px 32px;
            display:flex; flex-direction:column; position:relative;">

    </div>
  </div>

  <div style="flex:1; display:flex; align-items:center; gap:24px; margin:22px 0;">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9a9a9a" stroke-width="1.6" style="flex-shrink:0;">
      <polyline points="15 4 7 12 15 20"/></svg>

    <div style="flex:1; height:100%; background:#3d3d3d; border:1px dashed #5f5f5f; position:relative;

    </div>

    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9a9a9a" stroke-width="1.6" style="flex-shrink:0;">
      <polyline points="9 4 17 12 9 20"/></svg>
  </div>

  <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:24px;">
    <div style="display:flex; flex-direction:column; gap:8px; min-width:0;">
      <div style="font-size:13px; font-weight:600; color:#f2f2f2;">[이미지 캡션 — 본문 alt 또는 figcaption]</div>
      <div style="font:11px/1.4 ui-monospace, Menlo, monospace; color:#8a8a8a;">[출처 / 커미션 작가 표기 자리]</div>

              font:11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color:#8a8a8a;">
    ① 본문·갤러리의 이미지를 클릭하면 열린다 — 티스토리 기본 확대창을 덮는다.<br>
    ② ESC / 배경 클릭 / X 로 닫고, ← → 키와 화살표로 이동. 모바일은 스와이프.<br>
    ③ 캡션은 에디터에서 이미지 alt 또는 캡션에 친 것을 그대로 읽는다 — HTML 편집 없음.<br>
    ④ ⚠️ 스크롤 잠금 필요(배경이 같이 밀린다). 기존 카테고리 모달과 같은 방식 재사용.
