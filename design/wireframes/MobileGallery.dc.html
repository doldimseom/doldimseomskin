<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin:0; background:#ffffff; color:#1a1a1a;
      font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif;
      -webkit-font-smoothing: antialiased; }
    a { color:#1a1a1a; text-decoration:none; } a:hover { color:#000000; }
    .ph { position:relative; background:#ededed; border:1px dashed #bfbfbf; overflow:hidden; }
    .ph svg { position:absolute; inset:0; width:100%; height:100%; }
    .bar { height:10px; background:#e6e6e6; border-radius:2px; }
    .cap { font:11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color:#8a8a8a; letter-spacing:0.02em; }
    .chip { display:inline-block; padding:3px 8px; border:1px solid #c9c9c9; font:11px/1.2 ui-monospace, Menlo, monospace; color:#6b6b6b; }
    .note { border-left:2px dashed #c9c9c9; padding-left:10px;
      font:11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color:#8a8a8a; }
    .btn { border:1px solid #1a1a1a; padding:8px 14px; font-size:12px; display:inline-flex; align-items:center; gap:6px; }
    .rule { height:1px; background:#dcdcdc; }
  </style>
</helmet>

<div style="width:390px; padding:16px; box-sizing:border-box; display:flex; flex-direction:column;">
  <div class="cap" style="margin-bottom:14px;">WF-01M · 모바일 · 캐릭터 갤러리</div>

  <div style="display:flex; align-items:center; justify-content:space-between;">
    <div style="font-size:15px; font-weight:700;">[블로그명]</div>
    <div style="display:flex; gap:14px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.8"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="21" y2="21"/></svg>
    </div>
  </div>
  <div class="rule" style="margin:14px 0 18px;"></div>

  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;">
    <div style="font-size:14px; font-weight:600;">캐릭터</div>
    <span class="cap">8</span>
  </div>

  <div style="display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:14px;">
    <div style="display:flex; flex-direction:column; gap:8px;"><div class="ph" style="aspect-ratio:3/4;"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="0" y1="0" x2="100" y2="100" stroke="#d4d4d4" stroke-width="0.6"/><line x1="100" y1="0" x2="0" y2="100" stroke="#d4d4d4" stroke-width="0.6"/></svg></div><div style="font-size:12px; font-weight:600;">[캐릭터명 01]</div><div class="cap">제3관측반</div></div><div style="display:flex; flex-direction:column; gap:8px;"><div class="ph" style="aspect-ratio:3/4;"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="0" y1="0" x2="100" y2="100" stroke="#d4d4d4" stroke-width="0.6"/><line x1="100" y1="0" x2="0" y2="100" stroke="#d4d4d4" stroke-width="0.6"/></svg></div><div style="font-size:12px; font-weight:600;">[캐릭터명 02]</div><div class="cap">무소속</div></div><div style="display:flex; flex-direction:column; gap:8px;"><div class="ph" style="aspect-ratio:3/4;"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="0" y1="0" x2="100" y2="100" stroke="#d4d4d4" stroke-width="0.6"/><line x1="100" y1="0" x2="0" y2="100" stroke="#d4d4d4" stroke-width="0.6"/></svg></div><div style="font-size:12px; font-weight:600;">[캐릭터명 03]</div><div class="cap">제3관측반</div></div><div style="display:flex; flex-direction:column; gap:8px;"><div class="ph" style="aspect-ratio:3/4;"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="0" y1="0" x2="100" y2="100" stroke="#d4d4d4" stroke-width="0.6"/><line x1="100" y1="0" x2="0" y2="100" stroke="#d4d4d4" stroke-width="0.6"/></svg><div style="position:absolute; top:6px; left:6px; background:#fff; border:1px solid #1a1a1a; padding:1px 5px; font:9px/1.2 ui-monospace, Menlo, monospace;">잠김</div></div><div style="font-size:12px; font-weight:600;">[캐릭터명 04]</div><div class="cap">비공개</div></div>
  </div>

  <div style="display:flex; justify-content:center; gap:12px; margin:26px 0 22px;">
    <span class="cap">&lt;</span>
    <span style="font-size:12px; font-weight:600; border-bottom:1px solid #1a1a1a;">1</span>
    <span class="cap">2</span><span class="cap">&gt;</span>
  </div>

  <div class="note">
    ① 2열 고정 — 3열은 390px에서 증명사진이 너무 작아 얼굴이 안 보인다.<br>
    ② hover가 없으니 시크릿 플립은 탭 토글. 첫 탭 = 뒤집기, 두 번째 탭 = 이동으로 하면<br>
    &nbsp;&nbsp;&nbsp;&nbsp;글로 못 들어가는 사람이 생긴다 — 뒤집기는 별도 모서리 버튼으로 분리 제안.
  </div>
</div>
</x-dc>
</body>
</html>
